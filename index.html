<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar F5 | Links Oficiais</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccff00'><path d='M15 9H9v6h6V9zm-2 4h-2v-2h2v2zm8-2V9h-2V7c0-1.1-.9-2-2-2h-2V3h-2v2h-2V3H9v2H7c-1.1 0-2 .9-2 2v2H3v2H3v2h2v2c0 1.1.9 2 2 2h2v2h2v-2h2v2h2v-2h2c1.1 0 2-.9 2-2v-2h2v-2h-2v-2h2zm-4 6H7V7h10v10z'/></svg>">
  <!-- Ícones Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

  <div class="bio-wrapper">
    <!-- Cabeçalho / Perfil -->
    <header class="profile">
      <div class="brand-header">
        <img src="rf5_logo.webp" alt="Logo Radar F5" class="brand-logo">
        <h1>Radar F5</h1>
      </div>
      <p class="bio">Tecnologia & Negócios Digitais</p>
    </header>

    <!-- Lista de Links -->
    <main class="links-container">
      <a href="https://radarf5.com" target="_blank" class="link-card">
        <i class="ph ph-globe"></i>
        <span>Nosso Blog Oficial</span>
        <i class="ph ph-arrow-up-right"></i>
      </a>

      <a href="https://briito.github.io/negocioinabalavel" target="_blank" class="link-card highlight">
        <i class="ph ph-shopping-bag"></i>
        <span>Hub de Ofertas & Descontos</span>
        <i class="ph ph-arrow-up-right"></i>
      </a>

      <a href="#" target="_blank" class="link-card">
        <i class="ph ph-youtube-logo"></i>
        <span>Canal no YouTube</span>
        <i class="ph ph-arrow-up-right"></i>
      </a>

      <a href="#" target="_blank" class="link-card">
        <i class="ph ph-instagram-logo"></i>
        <span>Siga no Instagram</span>
        <i class="ph ph-arrow-up-right"></i>
      </a>
    </main>

    <!-- Rodapé -->
    <footer>
      <p>© 2026 Radar F5. Todos os direitos reservados.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
