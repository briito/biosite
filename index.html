<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar F5 | Links Oficiais</title>
  <link rel="stylesheet" href="style.css">
 <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Ícones Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

  <div class="bio-wrapper">
    <!-- Cabeçalho / Perfil -->
    <header class="profile">
      <div class="brand-header">
        <img src="rf5_logo.webp" alt="Logo Radar F5" class="brand-logo">
        <h1>Radar F5</h1>
      </div>
      <p class="bio">Tecnologia & Negócios Digitais</p>
    </header>

    <!-- Lista de Links -->
    <main class="links-container">
      <a href="https://pay.kiwify.com.br/3J0jzxS?afid=4GQgkmEn" target="_blank" rel="noopener noreferrer" class="link-card highlight">
        <i class="ph ph-money"></i>
        <span>Renda Recorrente</span>
        <i class="ph ph-arrow-up-right"></i>
      </a>

      <a href="https://radarf5.com" target="_blank" rel="noopener noreferrer" class="link-card">
        <i class="ph ph-globe"></i>
        <span>Blog Oficial</span>
        <i class="ph ph-arrow-up-right"></i>
      </a>

      <a href="https://www.facebook.com/radarf5" target="_blank" rel="noopener noreferrer" class="link-card">
        <i class="ph ph-facebook-logo"></i>
        <span>Facebook</span>
        <i class="ph ph-arrow-up-right"></i>
      </a>

      <a href="https://www.youtube.com/@radarf5" target="_blank" rel="noopener noreferrer" class="link-card">
        <i class="ph ph-youtube-logo"></i>
        <span>YouTube</span>
        <i class="ph ph-arrow-up-right"></i>
      </a>
    </main>

    <!-- Rodapé -->
    <footer>
      <p>© 2026 Radar F5. Todos os direitos reservados.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
