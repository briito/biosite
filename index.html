v<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar F5 | Links Oficiais</title>
  <link rel="stylesheet" href="style.css">
  <!-- Ícones Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

  <div class="bio-wrapper">
    <!-- Cabeçalho / Perfil -->
    <header class="profile">
      <div class="brand-header">
        <img src="rf5_logo.webp" alt="Logo Radar F5" class="brand-logo">
        <h1>Radar F5</h1>
      </div>
      <p class="bio">Tecnologia, Inovação e Tendências do Mundo Tech 🚀</p>
    </header>

    <!-- Lista de Links -->
    <main class="links-container">
      <a href="https://radarf5.com.br" target="_blank" class="link-card">
        <i class="ph ph-globe"></i>
        <span>Nosso Blog Oficial</span>
        <i class="ph ph-arrow-up-right"></i>
      </a>

      <a href="#" target="_blank" class="link-card highlight">
        <i class="ph ph-shopping-bag"></i>
        <span>Hub de Ofertas & Descontos</span>
        <i class="ph ph-arrow-up-right"></i>
      </a>

      <a href="#" target="_blank" class="link-card">
        <i class="ph ph-youtube-logo"></i>
        <span>Canal no YouTube</span>
        <i class="ph ph-arrow-up-right"></i>
      </a>

      <a href="#" target="_blank" class="link-card">
        <i class="ph ph-instagram-logo"></i>
        <span>Siga no Instagram</span>
        <i class="ph ph-arrow-up-right"></i>
      </a>
    </main>

    <!-- Rodapé -->
    <footer>
      <p>© 2026 Radar F5. Todos os direitos reservados.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
